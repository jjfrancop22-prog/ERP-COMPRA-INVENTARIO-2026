[build]
  command = "rm -rf node_modules src && echo ERP Compras: sitio estatico, sin compilacion Vite"
  publish = "."
  functions = "netlify/functions"

[[redirects]]
  from = "/*"
  to = "/index.html"
  status = 200

[[headers]]
  for = "/index.html"
  [headers.values]
    Cache-Control = "no-cache, no-store, must-revalidate"

[[headers]]
  for = "/service-worker.js"
  [headers.values]
    Cache-Control = "no-cache, no-store, must-revalidate"

[[headers]]
  for = "/release.json"
  [headers.values]
    Cache-Control = "no-cache, no-store, must-revalidate"

# Sitio estatico: Firebase Web API key es un identificador publico.
# Desactivar escaneo de secretos SOLO para este sitio estatico.
# Las credenciales privadas nunca deben incluirse en el repositorio.
[build.environment]
  SECRETS_SCAN_ENABLED = "false"
